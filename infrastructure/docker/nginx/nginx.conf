# ══════════════════════════════════════════════════════════════
#  VerseScan — Nginx API Gateway Configuration
#  Routes traffic from net_blue to internal services
# ══════════════════════════════════════════════════════════════

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Rate Limiting ─────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=scan:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=report:10m rate=10r/m;

    # ── Logging ───────────────────────────────────────────────
    log_format security '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'zone=$upstream_addr';

    access_log /var/log/nginx/access.log security;
    error_log  /var/log/nginx/error.log warn;

    # ── Upstream Backends ─────────────────────────────────────
    upstream scanner_backend {
        server scanner-engine:8000;
    }

    upstream dashboard_backend {
        server dashboard:3000;
    }

    upstream report_backend {
        server report-generator:9100;
    }

    upstream orchestrator_backend {
        server sandbox-orchestrator:9000;
    }

    # ── Main Server Block ─────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Disable server version exposure
        server_tokens off;

        # ── Scanner API (net_blue → net_red bridge) ──────────
        location /api/scan {
            limit_req zone=scan burst=3 nodelay;

            proxy_pass http://scanner_backend/scan;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
        }

        location /api/scan/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://scanner_backend/scan/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/history {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://scanner_backend/history;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Report Generator (net_blue) ──────────────────────
        location /api/report/ {
            limit_req zone=report burst=5 nodelay;

            proxy_pass http://report_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        location /api/owasp-report/ {
            limit_req zone=report burst=5 nodelay;

            proxy_pass http://report_backend/owasp/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }

        # ── Sandbox Orchestrator (net_blue → net_red) ────────
        location /api/sandbox/ {
            limit_req zone=api burst=10 nodelay;

            proxy_pass http://orchestrator_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Health Checks ────────────────────────────────────
        location /health {
            proxy_pass http://scanner_backend/;
        }

        location /health/sandbox {
            proxy_pass http://orchestrator_backend/health;
        }

        location /health/report {
            proxy_pass http://report_backend/health;
        }

        # ── Dashboard (net_blue, default route) ──────────────
        location / {
            proxy_pass http://dashboard_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ── Block direct access to internal networks ─────────
        location ~ ^/(internal|debug) {
            deny all;
            return 403;
        }
    }
}
